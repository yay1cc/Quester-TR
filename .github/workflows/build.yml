name: Windows build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Java ve Maven sürümlerini kontrol et
        shell: pwsh
        run: |
          java -version
          mvn -version

      - name: Testleri çalıştır ve JAR oluştur
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: WiX Toolset kur ve doğrula
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress --yes
          $candidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.14\bin",
            "C:\Program Files\WiX Toolset v3.11\bin"
          )
          $wixBin = $candidates | Where-Object { (Test-Path (Join-Path $_ "candle.exe")) -and (Test-Path (Join-Path $_ "light.exe")) } | Select-Object -First 1
          if (-not $wixBin) {
            $candle = Get-ChildItem "C:\Program Files*" -Filter candle.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candle) { $wixBin = $candle.DirectoryName }
          }
          if (-not $wixBin -or -not (Test-Path (Join-Path $wixBin "light.exe"))) {
            choco list --local-only
            throw "WiX candle.exe/light.exe bulunamadı; EXE paketleyicisi çalıştırılamıyor."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "WiX araçları bulundu: $wixBin"

      - name: Windows EXE oluştur
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jpackage --type exe --name Quester-TR --app-version 0.1.0 --input target --main-jar quester-tr.jar --main-class tr.quester.App --dest dist --win-menu --win-shortcut --win-per-user-install
          $installer = Get-ChildItem dist -Filter "*.exe"
          if (-not $installer) { throw "jpackage tamamlandı ancak EXE dosyası bulunamadı." }
          Get-Item $installer | Format-List Name,Length,FullName

      - name: EXE çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: Quester-TR-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
